
name: CI/CD

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  docker-build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ChromaDB dataset
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/milsever/production-ai-pipeline/releases/download/chroma-v1/data-chroma-v1.zip" \
            --output data-chroma-v1.zip

          unzip -q data-chroma-v1.zip -d .

          test -f data/chroma/chroma.sqlite3

      - name: Build Docker image
        run: docker build -t production-ai-service:ci .

      - name: Azure Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Install Container Apps CLI extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az extension add --name containerapp --upgrade

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name prodai20261109

      - name: Tag and Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="prodai20261109.azurecr.io/production-ai-service:${GITHUB_SHA}"

          docker tag production-ai-service:ci "$IMAGE"
          docker push "$IMAGE"

      - name: Deploy Customer API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az containerapp update \
            --name ca-customer-api \
            --resource-group rg-production-ai-pipeline \
            --image "prodai20261109.azurecr.io/production-ai-service:${GITHUB_SHA}"

      - name: Deploy AI Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az containerapp update \
            --name ca-production-ai-service \
            --resource-group rg-production-ai-pipeline \
            --image "prodai20261109.azurecr.io/production-ai-service:${GITHUB_SHA}"

