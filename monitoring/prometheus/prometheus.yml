global:
  scrape_interval: 1s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "production-ai-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]

  - job_name: "cadvisor"
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "windows-host"
    static_configs:
      - targets: ["host.docker.internal:9182"]
